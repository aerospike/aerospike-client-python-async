[package]
name = "aerospike_async"
version = "0.6.0-alpha.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_aerospike_async_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = "1.40"
aerospike-core = { git = "https://github.com/aerospike/aerospike-client-rust", rev = "724d69ca887653a402f1cf0d6394495ad64ef61e", package = "aerospike-core", features = ["rt-tokio", "dynamic-config"] }
hex = "0.4"
ordered-float = { version = "3", default-features = false }
pyo3-stub-gen = "0.23"
log = "0.4"
pyo3-log = "0.13"
futures = "0.3"
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "1.0", optional = true }
mimalloc = "0.1"
rand = { version = "0.8", features = ["small_rng"] }

[build-dependencies]
# Re-exports pyo3's interpreter cfgs (Py_3_13, Py_GIL_DISABLED, …) via build.rs
# so the crate can gate FFI on the target Python ABI.
pyo3-build-config = "0.29"

[features]
default = ["extension-module", "tls"]
extension-module = ["pyo3/extension-module"]
tls = ["aerospike-core/tls", "tokio-rustls", "rustls", "rustls-pemfile", "webpki-roots"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
