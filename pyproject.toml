[build-system]
requires = ["maturin>=1.9.0,<2.0"]
build-backend = "maturin"

[project]
name = "aerospike_async"
description = "Aerospike Python Async Client — async I/O over the Aerospike Rust client core (PyO3)"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
# uvloop is installed by default where it benefits (see __init__.py's guarded
# import — the code runs fine without it, as every Windows install proves).
# The python_version bound exists only because uvloop publishes no cp315
# wheels yet, which would fail 3.15 installs on uvloop's sdist build; delete
# the bound as soon as uvloop ships 3.15 wheels.
dependencies = ["uvloop>=0.17; sys_platform != 'win32' and python_version < '3.15'"]
python-packages = ["aerospike_async"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/aerospike/aerospike-client-python-async"
Issues = "https://github.com/aerospike/aerospike-client-python-async/issues"
Changelog = "https://github.com/aerospike/aerospike-client-python-async/releases"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "aerospike_async._aerospike_async_native"
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
