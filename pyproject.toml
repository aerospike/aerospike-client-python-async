[build-system]
requires = ["maturin>=1.9.0,<2.0"]
build-backend = "maturin"

[project]
name = "aerospike-async-core-v2"
description = "Aerospike Python Async Client (v2 core maintenance line) — async I/O over the released Aerospike Rust client core v2 (PyO3). For QA testing of rust-core v2; for v3 features install `aerospike-async`."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["uvloop>=0.17; sys_platform != 'win32'"]
python-packages = ["aerospike_async"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "aerospike_async._aerospike_async_native"
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
