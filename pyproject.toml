[build-system]
requires = ["maturin>=1.9.0,<2.0"]
build-backend = "maturin"

[project]
name = "aerospike_async"
description = "Aerospike Python Async Client — async I/O over the Aerospike Rust client core (PyO3)"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
# uvloop is installed by default where it benefits (see __init__.py's guarded
# import — the code runs fine without it, as every Windows install proves).
# The 0.23 floor is the first release carrying MagicStack/uvloop#721, which
# removes the `loop._ready_len` attribute whose non-atomic update races under
# free-threading; 0.22.1 wedges an AsyncPool 4x64 run outright. 0.23 is also
# the first release with cp315 wheels, so the python_version bound that kept
# 3.15 off uvloop's sdist build is no longer needed.
dependencies = ["uvloop>=0.23; sys_platform != 'win32'"]
python-packages = ["aerospike_async"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/aerospike/aerospike-client-python-async"
Issues = "https://github.com/aerospike/aerospike-client-python-async/issues"
Changelog = "https://github.com/aerospike/aerospike-client-python-async/releases"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "aerospike_async._aerospike_async_native"
python-source = "python"

[tool.ruff]
# Matches PSDK so one lint dialect covers both repos.
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Stubs re-export the compiled module with a star import.
"*.pyi" = ["F403"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
