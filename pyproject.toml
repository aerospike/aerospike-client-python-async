[build-system]
requires = ["maturin>=1.9.0,<2.0"]
build-backend = "maturin"

[project]
name = "aerospike_async"
description = "Aerospike Python Async Client — async I/O over the Aerospike Rust client core (PyO3)"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["uvloop>=0.17; sys_platform != 'win32'"]
python-packages = ["aerospike_async"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/aerospike/aerospike-client-python-async"
Issues = "https://github.com/aerospike/aerospike-client-python-async/issues"
Changelog = "https://github.com/aerospike/aerospike-client-python-async/releases"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "aerospike_async._aerospike_async_native"
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
