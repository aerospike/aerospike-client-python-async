name: Promote to prod

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run mode. Defaults to true for manual dispatch.
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  verify-ancestry:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify main tip is reachable from stage
        run: |
          git fetch origin stage
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/stage; then
            echo "::error::main tip $GITHUB_SHA is not reachable from origin/stage."
            echo "stage tip: $(git rev-parse origin/stage)"
            echo "main tip:  $GITHUB_SHA"
            exit 1
          fi
          echo "main tip $GITHUB_SHA is reachable from origin/stage"

  extract-version:
    needs: verify-ancestry
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    outputs:
      version: ${{ steps.extract.outputs.release-version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: extract
        uses: ./.github/actions/get-version
      - name: Resolve tag
        id: tag
        run: echo "tag=v${{ steps.extract.outputs.release-version }}" >> "$GITHUB_OUTPUT"

  promote-bundle:
    needs: [verify-ancestry, extract-version]
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          BUNDLE_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          echo "DRY-RUN: would promote release bundle"
          echo "  bundle-name: aerospike-client-python-async"
          echo "  version:     $BUNDLE_VERSION"
          echo "  environment: PROD"
          echo "  jf-project:  ${{ vars.JFROG_PROJECT }}"

      - name: Promote Release Bundle v2 to PROD
        if: env.DRY_RUN != 'true'
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@7b61b675476430553f09b94419ca18802d697e98 # v3.4.0
        with:
          bundle-name: aerospike-client-python-async
          version: ${{ needs.extract-version.outputs.version }}
          environment: PROD
          jf-project: ${{ vars.JFROG_PROJECT }}

  tag-main:
    needs: [verify-ancestry, extract-version, promote-bundle]
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      TAG: ${{ needs.extract-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLIENT_BOT_PAT || github.token }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would run git push origin $TAG"
            exit 0
          fi
          git push origin "$TAG"

  draft-github-release:
    needs: [extract-version, promote-bundle, tag-main]
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      TAG: ${{ needs.extract-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ needs.extract-version.outputs.version }}" | grep -qE "\-alpha|\-beta|\-rc"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DATE=$(date +"%B %d, %Y")
          API_JSON=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
            -d "{\"tag_name\":\"${{ env.TAG }}\"}")
          echo "$API_JSON" | jq -r '.body' \
            | python3 .github/scripts/generate_release_notes.py --date "$RELEASE_DATE" \
            > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Draft GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          body_path: release_notes.md
          generate_release_notes: false

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY-RUN: would draft GitHub release for $TAG"
          echo "--- release notes that would be used ---"
          cat release_notes.md

  verify-pypi:
    needs: [extract-version, draft-github-release]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    steps:
      - name: Poll PyPI for published version
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          pep440_version="${VERSION//-alpha./a}"
          pep440_version="${pep440_version//-beta./b}"
          pep440_version="${pep440_version//-rc./rc}"

          url="https://pypi.org/pypi/aerospike-async/${pep440_version}/json"
          echo "Polling $url"
          for i in {1..30}; do
            status="$(curl -sS -o /tmp/pypi.json -w '%{http_code}' "$url" || true)"
            if [[ "$status" == "200" ]]; then
              echo "PyPI version found: aerospike-async==${pep440_version}"
              exit 0
            fi
            echo "PyPI version not visible yet (HTTP $status), retry $i/30"
            sleep 20
          done
          echo "::error::PyPI version aerospike-async==${pep440_version} did not appear"
          exit 1
