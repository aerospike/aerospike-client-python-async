name: PNC Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version — must match Cargo.toml'
        required: true
        type: string
      dry_run:
        description: 'Dry-run mode (deploy + bundle creation are no-ops)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$CARGO_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Version mismatch: Cargo.toml has '$CARGO_VERSION' but dispatch requested '${{ inputs.version }}'"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists on remote"
            exit 1
          fi
          echo "Tag v${{ inputs.version }} is available"

      # Release candidates, stable included, build from stage. main only
      # moves after the bundle has been published, and tag-release.yaml
      # tags it then.
      - name: Enforce branch gate
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "stage" ]; then
            echo "::error::Releases must be dispatched from 'stage' (current: $BRANCH)"
            exit 1
          fi
          echo "Version ${{ inputs.version }} from branch $BRANCH — OK"

  build-release:
    name: Build release
    needs: validate
    uses: ./.github/workflows/build-release.yaml
    with:
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
