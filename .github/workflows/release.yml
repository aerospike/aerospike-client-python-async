name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0) — must match pyproject.toml and Cargo.toml'
        required: true
        type: string
      publish_pypi:
        description: 'Publish to PyPI?'
        required: false
        type: choice
        options:
          - 'no'
          - 'test.pypi.org'
          - 'pypi.org'
        default: 'no'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$CARGO_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Version mismatch: Cargo.toml has '$CARGO_VERSION' but release requested '${{ inputs.version }}'"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi
          # Also check remote tags
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ inputs.version }} already exists on remote"
            exit 1
          fi
          echo "Tag v${{ inputs.version }} is available"

      - name: Enforce stable releases from main
        run: |
          VERSION="${{ inputs.version }}"
          BRANCH="${{ github.ref_name }}"
          if echo "$VERSION" | grep -q -E "\-alpha|\-beta|\-rc"; then
            echo "Pre-release ($VERSION) — allowed from any branch ($BRANCH)"
          elif [ "$BRANCH" != "main" ]; then
            echo "::error::Stable releases must be cut from the main branch (current: $BRANCH)"
            exit 1
          else
            echo "Stable release ($VERSION) from main — OK"
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build-test.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ inputs.version }}" | grep -qE "\-alpha|\-beta|\-rc"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes (custom format)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DATE=$(date +"%B %d, %Y")
          TAG="v${{ inputs.version }}"
          API_JSON=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
            -d "{\"tag_name\":\"$TAG\"}")
          echo "$API_JSON" | jq -r '.body' | python3 .github/scripts/generate_release_notes.py --date "$RELEASE_DATE" > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Create GitHub Release
        uses: step-security/action-gh-release@dc29ef0d1f6f9a032a97ec797d9cb7ea788dde41 # v2.6.1
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          body_path: release_notes.md
          generate_release_notes: false
          files: dist/*

  publish:
    if: inputs.publish_pypi != 'no'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ inputs.publish_pypi == 'pypi.org' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
